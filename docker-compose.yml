version: '3.8'

services:
  # ============================================================
  # SCALA SCHEDULER (Next.js WebApp + ODG Scraper Python Unificato)
  # ============================================================
  scala-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ScalaScheduler
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      - TZ=Europe/Rome
      - NODE_ENV=production
      - SCHEDULER_API_URL=http://localhost:3000
    volumes:
      # Configurazioni WebApp (calendari.json, drive_config.json, service-account-key.json, users.json)
      - /srv/docker_conf/configs/ScalaScheduler/config:/app/config
      # Dati scraper (odg_structured.json, config.json, e cartella screenshot odg_shots/)
      - /srv/docker_conf/configs/ScalaScheduler/odg-scraper/config:/data
